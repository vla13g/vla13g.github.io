<!DOCTYPE html>
<!-- تم ربط ملف cache.appcache لعمل الموقع بدون إنترنت -->
<html lang="ar" dir="rtl" id="htmlTag" manifest="cache.appcache">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل PS4 - 13.52</title>
    <style>
        body {
            /* يمكنك تغيير 91353.png إلى logo_raw.png إذا أردت استخدام الشعار الجديد الموجود في ملفاتك */
            background-image: url('91353.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* نافذة الإعداد لأول مرة */
        #setupModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }
        .modal-content {
            background: #222;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 20px #00bfff;
            border: 2px solid #00bfff;
            width: 400px;
        }
        .modal-content h2 { color: #fff; margin-bottom: 20px; }
        .modal-content label { display: block; margin: 15px 0 5px; font-size: 18px; color: #ccc;}
        .modal-content select {
            width: 100%; padding: 10px; font-size: 16px;
            background: #333; color: white; border: 1px solid #555; border-radius: 5px;
        }
        .modal-content button {
            margin-top: 25px; padding: 12px 30px; font-size: 18px;
            background: #00bfff; color: #000; border: none; border-radius: 8px;
            cursor: pointer; font-weight: bold; width: 100%;
        }
        .modal-content button:hover { background: #008cba; color: white; }

        /* النصوص العلوية */
        .header-title {
            position: absolute;
            top: 20px;
            font-size: 40px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px #00bfff, 0 0 20px #00bfff, 2px 2px 5px #000;
            letter-spacing: 3px;
            font-family: 'Courier New', Courier, monospace;
        }
        
        .version-badge {
            position: absolute;
            top: 75px;
            background: rgba(220, 53, 69, 0.85);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            backdrop-filter: blur(3px);
        }

        /* زر الجيلبريك */
        .power-btn {
            padding: 25px 50px;
            border-radius: 20px;
            border: 4px solid #333;
            background-color: rgba(34, 34, 34, 0.8);
            color: #ccc;
            font-size: 45px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 0 20px rgba(0,0,0,0.8);
            margin-bottom: 25px;
            backdrop-filter: blur(3px);
            text-transform: uppercase;
        }
        .power-btn.active {
            background-color: rgba(26, 26, 26, 0.9);
            color: #28a745;
            border-color: #28a745;
            box-shadow: 0 0 40px #28a745, inset 0 0 20px #28a745;
            cursor: default;
        }
        .power-btn.error {
            background-color: rgba(26, 26, 26, 0.9);
            color: #dc3545;
            border-color: #dc3545;
            box-shadow: 0 0 40px #dc3545, inset 0 0 20px #dc3545;
        }

        #status {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px #000;
            margin-bottom: 25px;
            text-align: center;
        }

        /* صندوق الملاحظة */
        .info-note {
            background: rgba(0, 0, 0, 0.7);
            border-right: 4px solid #ffc107;
            padding: 15px;
            border-radius: 8px;
            max-width: 600px;
            text-align: center;
            font-size: 16px;
            line-height: 1.5;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        
        .info-note strong {
            color: #ffc107;
            display: block;
            margin-bottom: 5px;
            font-size: 18px;
        }

        /* الزوايا السفلية */
        .bottom-left, .bottom-right {
            position: absolute;
            bottom: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
        }
        .bottom-left {
            left: 20px;
            font-size: 24px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            direction: ltr; 
        }
        .bottom-right {
            right: 20px;
            text-decoration: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }
        .bottom-right:hover {
            background: rgba(29, 161, 242, 0.2);
        }
        .twitter-icon {
            width: 25px;
            height: 25px;
            margin-left: 10px;
            margin-right: 10px;
            fill: #1DA1F2;
        }

    </style>
</head>
<body>

    <div id="setupModal">
        <div class="modal-content">
            <h2>الإعداد لأول مرة<br>First Time Setup</h2>
            
            <label>اختر اللغة / Select Language:</label>
            <select id="langSelect">
                <option value="ar">العربية (Arabic)</option>
                <option value="en">English (الإنجليزية)</option>
                <option value="pt">Português (Brazilian)</option>
                <option value="ru">Русский (Russian)</option>
            </select>

            <label>نظام الوقت / Time Format:</label>
            <select id="timeSelect">
                <option value="12">12-Hour (AM/PM)</option>
                <option value="24">24-Hour</option>
            </select>

            <button onclick="saveSetup()">حفظ و دخول / Save & Enter</button>
        </div>
    </div>

    <div class="header-title">Vladimir Putin</div>
    <div class="version-badge" id="versionText">هذا الرابط يدعم الإصدار 13.52 فما دون</div>

    <button id="powerBtn" class="power-btn" onclick="startJailbreak()">
        JAILBREAK
    </button>

    <div id="status">النظام جاهز... اضغط على الزر للبدء</div>

    <div class="info-note" id="noteBox">
        <strong id="noteTitle">ملاحظة:</strong>
        <span id="noteText">يجب مسح جميع الصفحات في المتصفح (Webkit)، وإعادة كتابة الرابط، ومن ثم تفعيل الجيلبريك.</span>
    </div>

    <div class="bottom-left" id="clock">00:00:00</div>

    <a href="#" class="bottom-right" id="twitterBtn">
        <span id="twitterText">تويتر</span>
        <svg class="twitter-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M23.643 4.937c-.835.37-1.732.62-2.675.733.962-.576 1.7-1.49 2.048-2.578-.9.534-1.897.922-2.958 1.13-.85-.904-2.06-1.47-3.4-1.47-2.572 0-4.658 2.086-4.658 4.66 0 .364.042.718.12 1.06-3.873-.195-7.304-2.05-9.602-4.868-.4.69-.63 1.49-.63 2.342 0 1.616.823 3.043 2.072 3.878-.764-.025-1.482-.234-2.11-.583v.06c0 2.257 1.605 4.14 3.737 4.568-.392.106-.803.162-1.227.162-.3 0-.593-.028-.877-.082.593 1.85 2.313 3.198 4.352 3.234-1.595 1.25-3.604 1.995-5.786 1.995-.376 0-.747-.022-1.112-.065 2.062 1.323 4.51 2.093 7.14 2.093 8.57 0 13.255-7.098 13.255-13.254 0-.2-.005-.402-.014-.602.91-.658 1.7-1.477 2.323-2.41z"></path>
        </svg>
    </a>

    <!-- تم تحديث ملفات التعديل لتطابق مجلدك الجديد -->
    <script src="int64.js"></script>
    <script src="ps4_offsets.js"></script>
    <script src="core.js"></script>
    <script src="mem.js"></script>
    <script src="rpc_worker.js"></script>
    <script src="jb.js"></script>
    
    <script>
        const translations = {
            ar: {
                version: "هذا الرابط يدعم الإصدار 13.52 فما دون",
                statusReady: "النظام جاهز... اضغط على الزر للبدء",
                statusInjecting: "جاري حقن التعديل...",
                statusSuccess: "تم تفعيل التعديل بنجاح!",
                statusError: "حدث خطأ، يرجى المحاولة مرة ثانية",
                noteTitle: "ملاحظة:",
                noteText: "يجب مسح جميع الصفحات في المتصفح (Webkit)، وإعادة كتابة الرابط، ومن ثم تفعيل الجيلبريك.",
                jbBtn: "تفعيل الجيلبريك",
                twitter: "تويتر",
                dir: "rtl"
            },
            en: {
                version: "This link supports version 13.52 and below",
                statusReady: "System ready... Press the button to start",
                statusInjecting: "Injecting payload...",
                statusSuccess: "Jailbreak activated successfully!",
                statusError: "An error occurred, please try again",
                noteTitle: "Note:",
                noteText: "You must clear all browser pages (Webkit), rewrite the link, and then activate the jailbreak.",
                jbBtn: "START JAILBREAK",
                twitter: "Twitter",
                dir: "ltr"
            },
            pt: {
                version: "Este link suporta a versão 13.52 e inferior",
                statusReady: "Sistema pronto... Pressione o botão para iniciar",
                statusInjecting: "Injetando payload...",
                statusSuccess: "Jailbreak ativado com sucesso!",
                statusError: "Ocorreu um erro, por favor tente novamente",
                noteTitle: "Nota:",
                noteText: "Você deve limpar todas as páginas do navegador (Webkit), reescrever o link e então ativar o jailbreak.",
                jbBtn: "ATIVAR JAILBREAK",
                twitter: "Twitter",
                dir: "ltr"
            },
            ru: {
                version: "Эта ссылка поддерживает версию 13.52 и ниже",
                statusReady: "Система готова... Нажмите кнопку для запуска",
                statusInjecting: "Внедрение payload...",
                statusSuccess: "Взлом успешно активирован!",
                statusError: "Произошла ошибка, пожалуйста, попробуйте еще раз",
                noteTitle: "Примечание:",
                noteText: "Вы должны очистить все страницы браузера (Webkit), переписать ссылку, а затем активировать взлом.",
                jbBtn: "ЗАПУСК ВЗЛОМА",
                twitter: "Twitter",
                dir: "ltr"
            }
        };

        let currentLang = 'ar';
        let is24Hour = false;
        let isJailbroken = false;
        
        const powerBtn = document.getElementById('powerBtn');
        const statusText = document.getElementById('status');

        window.onload = function() {
            if (!localStorage.getItem('setupDone')) {
                document.getElementById('setupModal').style.display = 'flex';
            } else {
                currentLang = localStorage.getItem('userLang');
                is24Hour = localStorage.getItem('timeFormat') === '24';
                applyLanguage(currentLang);
            }
            updateClock();
        };

        function saveSetup() {
            const lang = document.getElementById('langSelect').value;
            const timeFmt = document.getElementById('timeSelect').value;
            
            localStorage.setItem('userLang', lang);
            localStorage.setItem('timeFormat', timeFmt);
            localStorage.setItem('setupDone', 'true');
            
            currentLang = lang;
            is24Hour = (timeFmt === '24');
            
            document.getElementById('setupModal').style.display = 'none';
            applyLanguage(currentLang);
        }

        function applyLanguage(lang) {
            const t = translations[lang];
            document.getElementById('htmlTag').dir = t.dir;
            document.getElementById('versionText').innerText = t.version;
            document.getElementById('noteTitle').innerText = t.noteTitle;
            document.getElementById('noteText').innerText = t.noteText;
            document.getElementById('twitterText').innerText = t.twitter;
            
            const noteBox = document.getElementById('noteBox');
            if(t.dir === 'rtl') {
                noteBox.style.borderRight = '4px solid #ffc107';
                noteBox.style.borderLeft = 'none';
            } else {
                noteBox.style.borderLeft = '4px solid #ffc107';
                noteBox.style.borderRight = 'none';
            }
            
            if (!isJailbroken) {
                statusText.innerText = t.statusReady;
                powerBtn.innerText = t.jbBtn;
            }
        }

        function startJailbreak() {
            if (isJailbroken) return; 

            const t = translations[currentLang];
            
            powerBtn.className = 'power-btn active';
            statusText.innerText = t.statusInjecting;
            statusText.style.color = "#00bfff";
            powerBtn.innerText = "WAIT...";
            
            try {
                // إذا كانت حزمتك تتطلب الانتقال إلى صفحة jb.html للتفعيل الفعلي،
                // سيتم تحويلك برمجياً بعد ثانية ونصف، وإلا سيستمر السكريبت بالعمل هنا.
                setTimeout(() => {
                    if (typeof runJailbreak === 'function') {
                        successJailbreak(); 
                    } else {
                        window.location.href = "jb.html";
                    }
                }, 1500);

            } catch (error) {
                errorJailbreak();
            }
        }

        function successJailbreak() {
            const t = translations[currentLang];
            statusText.innerText = t.statusSuccess;
            statusText.style.color = "#28a745";
            powerBtn.className = 'power-btn active';
            powerBtn.innerText = "JAILBREAK ON";
            isJailbroken = true;
        }

        function errorJailbreak() {
            const t = translations[currentLang];
            statusText.innerText = t.statusError;
            statusText.style.color = "#dc3545";
            powerBtn.className = 'power-btn error';
            powerBtn.innerText = "ERROR";
            isJailbroken = false;
        }

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            let ampm = '';
            
            if (!is24Hour) {
                ampm = hours >= 12 ? ' PM' : ' AM';
                hours = hours % 12;
                hours = hours ? hours : 12; 
            }
            
            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            
            document.getElementById('clock').innerText = hours + ':' + minutes + ':' + seconds + ampm;
        }
        
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
