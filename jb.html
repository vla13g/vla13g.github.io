<!DOCTYPE html>
<html lang="ar" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jailbreak Execution</title>
    <style>
        body {
            background-image: url('91353.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        .message-box {
            background: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border-radius: 15px;
            border: 2px solid #00bfff;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 191, 255, 0.5);
            max-width: 600px;
            z-index: 9999;
            position: relative;
            backdrop-filter: blur(5px);
        }
        
        h2 { color: #00bfff; margin-bottom: 20px; font-size: 28px;}
        
        .error-text { color: #dc3545; font-size: 32px; font-weight: bold; display: none; }
        .reboot-note { color: #ffc107; font-size: 20px; margin-top: 20px; display: none; line-height: 1.6; }
        
        .spinner {
            border: 6px solid rgba(255, 255, 255, 0.1);
            border-top: 6px solid #00bfff;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    
    <!-- صندوق الواجهة الاحترافي -->
    <div class="message-box" id="msgBox">
        <div class="spinner" id="loadingSpinner"></div>
        <h2 id="statusTitle">جاري التعديل...</h2>
        <div class="error-text" id="mainError">❌ فشل التعديل</div>
        <div class="reboot-note" id="subError">حدث خطأ. يرجى إعادة تشغيل جهازك (Restart) بالكامل، ومن ثم المحاولة من جديد.</div>
    </div>

    <script>
        // قاموس اللغات لصفحة التعديل الفعلي
        const translations = {
            ar: {
                title: "جاري التعديل... يرجى الانتظار",
                error: "❌ فشل التعديل",
                reboot: "حدث خطأ في النظام. يرجى إعادة تشغيل جهازك (Restart) بالكامل، ومن ثم المحاولة من جديد.",
                dir: "rtl"
            },
            en: {
                title: "Jailbreaking... Please wait",
                error: "❌ Jailbreak Failed",
                reboot: "A system error occurred. Please completely restart your console (Restart), then try again.",
                dir: "ltr"
            },
            pt: {
                title: "Fazendo Jailbreak... Aguarde",
                error: "❌ Falha no Jailbreak",
                reboot: "Ocorreu um erro no sistema. Por favor, reinicie completamente o seu console e tente novamente.",
                dir: "ltr"
            },
            ru: {
                title: "Взлом... Пожалуйста, подождите",
                error: "❌ Ошибка взлома",
                reboot: "Произошла системная ошибка. Пожалуйста, полностью перезагрузите консоль, затем попробуйте снова.",
                dir: "ltr"
            }
        };

        // استدعاء لغة المستخدم المحفوظة من الصفحة الأولى (index.html)
        const userLang = localStorage.getItem('userLang') || 'ar';
        const t = translations[userLang];
        
        document.getElementById('htmlTag').dir = t.dir;
        document.getElementById('statusTitle').innerText = t.title;
        document.getElementById('mainError').innerText = t.error;
        document.getElementById('subError').innerText = t.reboot;

        // دالة تحويل الواجهة لوضع الخطأ الاحترافي
        function triggerProfessionalError() {
            document.getElementById('loadingSpinner').style.display = 'none';
            document.getElementById('statusTitle').style.display = 'none';
            
            document.getElementById('mainError').style.display = 'block';
            document.getElementById('subError').style.display = 'block';
            
            document.getElementById('msgBox').style.borderColor = '#dc3545';
            document.getElementById('msgBox').style.boxShadow = '0 0 30px rgba(220, 53, 69, 0.8)';
        }

        // مراقب ذكي (Observer) لمسح الرسالة القديمة "Refresh the page..." فور ظهورها وعرض التصميم الجديد
        const observer = new MutationObserver((mutations) => {
            let text = document.body.innerText || "";
            if (text.includes("Refresh the page") || text.includes("run again") || text.includes("Not enough memory")) {
                triggerProfessionalError();
                
                // إخفاء النصوص القديمة البشعة من الشاشة
                Array.from(document.body.childNodes).forEach(node => {
                    if (node.nodeType === Node.TEXT_NODE) {
                        node.textContent = '';
                    } else if (node.tagName !== 'DIV' && node.tagName !== 'SCRIPT' && node.tagName !== 'STYLE') {
                        node.style.display = 'none';
                    }
                });
            }
        });
        observer.observe(document.body, { childList: true, subtree: true, characterData: true });
    </script>

    <!-- استدعاء ملفات الجيلبريك الأصلية -->
    <script src="int64.js"></script>
    <script src="ps4_offsets.js"></script>
    <script src="core.js"></script>
    <script src="mem.js"></script>
    <script src="rpc_worker.js"></script>
    <script src="jb.js"></script>
</body>
</html>
